name: Privacy Shield Network adapter validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-shield-network-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/validate_privacy_shield_adapter.py

      - name: Validate Privacy Shield Network adapter contract
        run: python3 scripts/validate_privacy_shield_adapter.py
