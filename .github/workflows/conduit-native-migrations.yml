name: Conduit Native Migration Contract

on:
  pull_request:
    paths:
      - "native/conduit/**"
      - "scripts/validate-conduit-migrations.py"
      - ".github/workflows/conduit-native-migrations.yml"
  push:
    branches:
      - main
      - agent/**
    paths:
      - "native/conduit/**"
      - "scripts/validate-conduit-migrations.py"
      - ".github/workflows/conduit-native-migrations.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate migration registry and native control
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Validate Conduit native-feature registry
        run: python3 scripts/validate-conduit-native-features.py

      - name: Validate Conduit migration contracts
        run: python3 scripts/validate-conduit-migrations.py

      - name: Test first-party Conduit Control contract
        run: go test ./native/conduit/control
