name: Conduit Native Migration Contract

on:
  pull_request:
    paths:
      - "native/conduit/**"
      - "management/cmd/conduit_status.go"
      - "management/cmd/conduit_status_test.go"
      - "deploy/goreecloud-staging/acceptance_evidence.py"
      - "deploy/goreecloud-staging/test_acceptance_evidence.py"
      - "deploy/goreecloud-staging/validate_conduit_evidence.py"
      - "deploy/goreecloud-staging/build_conduit_evidence.py"
      - "deploy/goreecloud-staging/test_build_conduit_evidence.py"
      - "scripts/validate-conduit-migrations.py"
      - ".github/workflows/conduit-native-migrations.yml"
  push:
    branches:
      - main
      - agent/**
    paths:
      - "native/conduit/**"
      - "management/cmd/conduit_status.go"
      - "management/cmd/conduit_status_test.go"
      - "deploy/goreecloud-staging/acceptance_evidence.py"
      - "deploy/goreecloud-staging/test_acceptance_evidence.py"
      - "deploy/goreecloud-staging/validate_conduit_evidence.py"
      - "deploy/goreecloud-staging/build_conduit_evidence.py"
      - "deploy/goreecloud-staging/test_build_conduit_evidence.py"
      - "scripts/validate-conduit-migrations.py"
      - ".github/workflows/conduit-native-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate migration registry and native control
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Validate Conduit native-feature registry
        run: python3 scripts/validate-conduit-native-features.py

      - name: Validate Conduit migration contracts
        run: python3 scripts/validate-conduit-migrations.py

      - name: Validate Conduit evidence tooling syntax
        run: python3 -m py_compile deploy/goreecloud-staging/validate_conduit_evidence.py deploy/goreecloud-staging/build_conduit_evidence.py deploy/goreecloud-staging/test_build_conduit_evidence.py

      - name: Validate Conduit isolated-evidence example end to end
        run: python3 deploy/goreecloud-staging/validate_conduit_evidence.py native/conduit/isolated-evidence.example.json

      - name: Test Conduit isolated-evidence generator
        run: python3 deploy/goreecloud-staging/test_build_conduit_evidence.py

      - name: Test first-party Conduit Control contract
        run: go test ./native/conduit/control

      - name: Test Conduit management runtime integration
        run: go test ./management/cmd -run '^TestConduitStatus'

      - name: Test sanitized Conduit runtime evidence boundary
        run: python3 deploy/goreecloud-staging/test_acceptance_evidence.py
