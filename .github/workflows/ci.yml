name: Native Network CI

on:
  push:
    branches: [main, "develop/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-network-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  server-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test server and persistence
        run: go test ./...
      - name: Vet server
        run: go vet ./...
      - name: Validate dashboard JavaScript syntax
        run: node --check apps/web/app.js
      - name: Validate platform contract anchors
        run: |
          grep -q 'version: 0.1.0-dev.3' goreecloud.platform.yaml
          grep -q 'lifecycle: Development' goreecloud.platform.yaml
          grep -q 'production_ready: false' goreecloud.platform.yaml
          grep -q 'stable_eligible: false' goreecloud.platform.yaml
          grep -q 'server: development_persistent_control_plane' goreecloud.platform.yaml
          grep -q 'web_dashboard: development_dashboard' goreecloud.platform.yaml
          grep -q 'android: development_client' goreecloud.platform.yaml
          grep -q 'google_tv: development_client' goreecloud.platform.yaml
          grep -q 'ios: development_client' goreecloud.platform.yaml
          grep -q 'controlplane_persistence: implemented_development_revisioned_file_store' goreecloud.platform.yaml
          grep -q 'controlplane_migrations: implemented_development_schema_v1_ledger' goreecloud.platform.yaml
          grep -q 'persistence: development_file_store' goreecloud.platform.yaml
          grep -q 'schema_version: 1' goreecloud.platform.yaml
          grep -q 'integrity: sha256' goreecloud.platform.yaml
          grep -q 'multi_writer: false' goreecloud.platform.yaml
          grep -q 'authentication: not_implemented' goreecloud.platform.yaml
          grep -q 'policy_mode: deny_by_default' goreecloud.platform.yaml
          grep -q 'access_policy_evaluation: implemented_decision_only_deny_by_default' goreecloud.platform.yaml
          grep -q 'tunnel: not_implemented' goreecloud.platform.yaml

  ios-core:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Test portable iOS core package
        run: swift test

  android-sources:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [android, google-tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build native client source
        run: gradle -p "apps/${{ matrix.app }}" :app:assembleDebug --stacktrace
