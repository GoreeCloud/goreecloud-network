name: Native Bootstrap CI

on:
  push:
    branches: [main, "develop/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test server
        run: go test ./...
      - name: Vet server
        run: go vet ./...
      - name: Validate dashboard JavaScript syntax
        run: node --check apps/web/app.js
      - name: Validate platform contract anchors
        run: |
          grep -q 'lifecycle: Development' goreecloud.platform.yaml
          grep -q 'stable_eligible: false' goreecloud.platform.yaml
          grep -q 'android: source_bootstrap' goreecloud.platform.yaml
          grep -q 'google_tv: source_bootstrap' goreecloud.platform.yaml
          grep -q 'ios: source_bootstrap' goreecloud.platform.yaml

  ios-core:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Test portable iOS core package
        run: swift test

  android-sources:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [android, google-tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build native client source
        run: gradle -p "apps/${{ matrix.app }}" :app:assembleDebug --stacktrace
