name: GoreeCloud staging images

on:
  pull_request:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish exact-revision staging images to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: goreecloud-staging-images-${{ github.ref }}
  cancel-in-progress: true

env:
  MANAGEMENT_IMAGE: ghcr.io/goreecloud/goreecloud-network-management
  SIGNAL_IMAGE: ghcr.io/goreecloud/goreecloud-network-signal
  RELAY_IMAGE: ghcr.io/goreecloud/goreecloud-network-relay

jobs:
  build-staging-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64 server binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux/amd64

          VERSION="staging-${GITHUB_SHA}"
          LDFLAGS="-s -w -X github.com/netbirdio/netbird/version.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.builtBy=goreecloud-staging"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o linux/amd64/netbird-mgmt ./management

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o linux/amd64/netbird-signal ./signal

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o linux/amd64/netbird-relay ./relay

          test -s linux/amd64/netbird-mgmt
          test -s linux/amd64/netbird-signal
          test -s linux/amd64/netbird-relay
          sha256sum linux/amd64/netbird-* | tee staging-binary-sha256.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide publication mode
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.publication.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build management staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: management/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: ${{ env.MANAGEMENT_IMAGE }}:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            goreecloud.environment=staging

      - name: Build signal staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: signal/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: ${{ env.SIGNAL_IMAGE }}:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            goreecloud.environment=staging

      - name: Build relay staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: ${{ env.RELAY_IMAGE }}:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            goreecloud.environment=staging

      - name: Write exact-revision staging image manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > goreecloud-staging-images.env <<EOF
          GOREECLOUD_NETWORK_MANAGEMENT_IMAGE=${MANAGEMENT_IMAGE}:staging-${GITHUB_SHA}
          GOREECLOUD_NETWORK_SIGNAL_IMAGE=${SIGNAL_IMAGE}:staging-${GITHUB_SHA}
          GOREECLOUD_NETWORK_RELAY_IMAGE=${RELAY_IMAGE}:staging-${GITHUB_SHA}
          GOREECLOUD_NETWORK_SOURCE_REVISION=${GITHUB_SHA}
          EOF

          {
            echo '### GoreeCloud staging image contract'
            echo
            echo "Source revision: \`${GITHUB_SHA}\`"
            echo
            echo '```dotenv'
            cat goreecloud-staging-images.env
            echo '```'
            echo
            if [[ "${{ steps.publication.outputs.publish }}" == "true" ]]; then
              echo 'Exact-revision images were published to GHCR.'
            else
              echo 'Images were built for validation only and were not published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging image evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-staging-image-evidence-${{ github.sha }}
          path: |
            goreecloud-staging-images.env
            staging-binary-sha256.txt
          if-no-files-found: error
          retention-days: 14
